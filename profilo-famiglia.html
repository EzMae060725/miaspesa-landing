<script>
(function () {
  var API = 'https://panel-scontrini-production.up.railway.app/api/candidatura/full/';
  var token = new URLSearchParams(location.search).get('t') || '';
  var app = document.getElementById('app');
  var S = { dati: null, risposte: {}, sezione: 1, invio: false, comuni: {}, confermati: {} };
  // Ez 14.11.26 P61 - tempo attivo per sezione (le pause oltre la pausa massima non contano)
  var TR = { sid: (Math.random().toString(36).slice(2, 10) + Date.now().toString(36)).toLowerCase(), ultimo: Date.now(), per: {} };
  function trAttivita() {
    var ora = Date.now(), d = (ora - TR.ultimo) / 1000, pausa = (S.dati && S.dati.tracking && S.dati.tracking.pausaMaxSecondi) || 300;
    TR.ultimo = ora;
    if (S.dati && d > 0 && d <= pausa) TR.per[S.sezione] = (TR.per[S.sezione] || 0) + d;
  }
  ['input', 'change', 'click', 'keydown', 'scroll', 'touchstart', 'pointerdown'].forEach(function (e) { document.addEventListener(e, trAttivita, { passive: true, capture: true }); });
  function trDati() { trAttivita(); if (S.dati && S.dati.tracking && S.dati.tracking.attivo === false) return null; var p = {}; for (var k in TR.per) p[k] = Math.round(TR.per[k]); return { sid: TR.sid, perSezione: p }; }

  // ---------------------------------------------------------------- P47c: luoghi e coerenza (regole dal server)
  function normNome(v) { return String(v == null ? '' : v).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, ''); }

  // Ez 17.11.26 P80 (3.3 fase 1) - liste lunghe di insegne: "Suggerite per te" dalle insegne gia' nominate, ricerca, "Mostra tutte"
  var SUGG_FONTI = ['QP_SUPERMERCATO1', 'QP_SUPERMERCATO2', 'QP_SUPERMERCATO3', 'QP_NOTORIETA', 'QP_CONSIGLIA', 'QP_CARTE_NOMI', 'QP_APP_CATENE'];
  function cfgSugg() { return (S.dati && S.dati.suggerimentiInsegne) || {}; }
  function insegneSuggerite(nomi, escludi) {
    var SC = cfgSugg(), fonti = ((SC.fonti && SC.fonti.length) ? SC.fonti : SUGG_FONTI).filter(function (c) { return c !== escludi; }), risp = []; // P80b
    fonti.forEach(function (c) { var v = S.risposte[c]; (Array.isArray(v) ? v : [v]).forEach(function (x) { if (typeof x === 'string') x.split(/[,;\n]/).forEach(function (y) {
      var n = normNome(y); if (n.length >= 2) risp.push({ p: n, w: y.split(/\s+/).map(normNome).filter(Boolean) }); }); }); });
    var esatti = {}; nomi.forEach(function (r) { var n = normNome(r.v); if (n && risp.some(function (a) { return a.p === n || a.w.indexOf(n) >= 0; })) esatti[n] = true; });
    var libere = risp.filter(function (a) { return !esatti[a.p] && !a.w.some(function (x) { return esatti[x]; }); }); // gia' riconosciute: niente varianti
    return nomi.filter(function (r) {
      var n = normNome(r.v), prima = normNome(String(r.v).split(/\s+/)[0]);
      if (!n) return false;
      return !!esatti[n] || libere.some(function (a) { var p = a.p; return (n.length >= 3 && p.indexOf(n) >= 0) || (p.length >= 4 && n.indexOf(p) >= 0) || (prima.length >= 4 && p.indexOf(prima) >= 0); }); });
  }
  function ordinaSuggerite(nomi, codice) { // P80b: gruppi "Suggerite per te" / "Tutte le insegne"
    var SC = cfgSugg();
    if (nomi.length <= (Number(SC.soglia) || 15)) return nomi;
    var sugg = insegneSuggerite(nomi, codice);
    if (!sugg.length) return nomi;
    var g1 = SC.titolo || 'Suggerite per te', g2 = SC.titoloTutte || 'Tutte le insegne';
    return sugg.map(function (r) { return { v: r.v, t: r.t, gruppo: g1 }; }).concat(
      nomi.filter(function (r) { return !sugg.some(function (x) { return x.v === r.v; }); }).map(function (r) { return { v: r.v, t: r.t, gruppo: g2 }; }));
  }
  function intervalloFascia(v) {
    var x = String(v == null ? '' : v).trim(), m;
    if ((m = x.match(/^(\d+)\s*-\s*(\d+)$/))) return [Number(m[1]), Number(m[2])];
    if ((m = x.match(/^(\d+)\s*\+$/))) return [Number(m[1]), 200];
    if ((m = x.match(/^(\d+)$/))) return [Number(m[1]), Number(m[1])];
    return null;
  }
  function etaDaAnno(anno) { var a = parseInt(anno, 10); if (!(a > 1900)) return null; var e = new Date().getFullYear() - a; return [e - 1, e]; }
  function fasceDi(r) { var d = S.dati.domande.filter(function (x) { return x.codice === r.righe; })[0]; return (d && d.campi && d.campi[r.campo || 'eta']) || []; }
  // Ez 11.11.26 P51 - stesse regole del server (services/questionarioFull.js)
  function codiciRegola(r) {
    if (!r) return [];
    if (r.tipo === 'insegne_ripetute') return Array.isArray(r.codici) ? r.codici : [];
    if (r.tipo === 'carte_numero') return [r.numero, r.nomi].filter(Boolean);
    return [r.anno, r.righe].filter(Boolean);
  }
  // Ez 28.11.26 P114 - toglie il numero civico in fondo alla via (stessa regola di questionarioFull.js togliNumeroCivico)
  function togliNumeroCivico(testo) {
    if (typeof testo !== 'string') return testo;
    var t = testo.trim();
    var m = t.match(/^(.*?)[\s,]+(?:(?:n\.?|n°|nr\.?|num\.?|civico)\s*)?\d+(?:\s*[\/-]?\s*(?:[a-z]{1,2}|bis|ter))?$/i);
    if (!m) return t;
    var resto = m[1].trim().replace(/[\s,]+$/, '');
    if (!/[a-zà-ù]{2,}/i.test(resto) || resto.split(/\s+/).length < 2) return t;
    if (/\b(provinciale|statale|regionale|comunale|sp|ss|sr|sc|km)\.?$/i.test(resto)) return t;
    return resto;
  }
  function testoConRisposte(testo) {
    function val(c) { var v = S.risposte[c]; return v == null ? '' : Array.isArray(v) ? v.join(', ') : typeof v === 'object' ? '' : String(v).trim(); }
    return String(testo || '').replace(/\s*\(\{(QP_\w+)\}\)/g, function (m, c) { return val(c) ? ' (' + val(c) + ')' : ''; }).replace(/\{(QP_\w+)\}/g, function (m, c) { return val(c); });
  }
  function problemiAltre(r) {
    var out = [];
    if (r.tipo === 'insegne_ripetute') {
      var cod = Array.isArray(r.codici) ? r.codici : [], pos = Array.isArray(r.posizioni) ? r.posizioni : [], visti = {};
      cod.forEach(function (c, i) {
        var v = S.risposte[c];
        if (typeof v !== 'string' || !v.trim()) return;
        var k = normNome(v);
        if (visti[k]) {
          var j = visti[k].j;
          out.push({ firma: 'insegne|' + k + '|' + j + '|' + i, codici: [cod[j], c], testo: String(r.messaggio || '').replace('{insegna}', visti[k].nome).replace('{a}', pos[j] || String(j + 1)).replace('{b}', pos[i] || String(i + 1)) });
        } else visti[k] = { j: i, nome: v.trim() };
      });
    } else if (r.tipo === 'carte_numero') {
      var n = String(S.risposte[r.numero] == null ? '' : S.risposte[r.numero]).trim();
      var nomi = Array.isArray(S.risposte[r.nomi]) ? S.risposte[r.nomi].filter(function (x) { return String(x || '').trim(); }) : [];
      if (/^\d+$/.test(n) && nomi.length > Number(n)) out.push({ firma: 'carte|' + n + '|' + nomi.length, codici: [r.numero, r.nomi], testo: String(r.messaggio || '').replace('{n}', n).replace('{m}', String(nomi.length)) });
    }
    return out;
  }
  function problemiCoerenza(n) {
    var qs = domandeSezione(n).map(function (d) { return d.codice; });
    var out = [];
    (S.dati.coerenza || []).forEach(function (r, i) {
      var inSez = codiciRegola(r).filter(function (c) { return qs.indexOf(c) >= 0; });
      if (!inSez.length) return;
      var sotto = inSez[inSez.length - 1];
      if (r.tipo === 'insegne_ripetute' || r.tipo === 'carte_numero') {
        problemiAltre(r).forEach(function (p, k) { out.push({ chiave: 'c' + i + '_' + k, firma: p.firma, codici: p.codici, sotto: qs.indexOf(p.codici[1]) >= 0 ? p.codici[1] : sotto, testo: p.testo }); });
        return;
