<div id="versioneQ" style="max-width:680px;margin:0 auto;padding:0 20px 40px;text-align:right;font-size:0.7rem;color:#9CA3AF;letter-spacing:0.5px"></div>

<script>
(function () {
  var API = 'https://panel-scontrini-production.up.railway.app/api/candidatura/full/';
  var token = new URLSearchParams(location.search).get('t') || '';
  var app = document.getElementById('app');
  var S = { dati: null, risposte: {}, sezione: 1, invio: false, comuni: {}, confermati: {} };

  // ---------------------------------------------------------------- P47c: luoghi e coerenza (regole dal server)
  function normNome(v) { return String(v == null ? '' : v).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, ''); }
  function intervalloFascia(v) {
    var x = String(v == null ? '' : v).trim(), m;
    if ((m = x.match(/^(\d+)\s*-\s*(\d+)$/))) return [Number(m[1]), Number(m[2])];
    if ((m = x.match(/^(\d+)\s*\+$/))) return [Number(m[1]), 200];
    if ((m = x.match(/^(\d+)$/))) return [Number(m[1]), Number(m[1])];
    return null;
  }
  function etaDaAnno(anno) { var a = parseInt(anno, 10); if (!(a > 1900)) return null; var e = new Date().getFullYear() - a; return [e - 1, e]; }
  function fasceDi(r) { var d = S.dati.domande.filter(function (x) { return x.codice === r.righe; })[0]; return (d && d.campi && d.campi[r.campo || 'eta']) || []; }
  // Ez 11.11.26 P51 - stesse regole del server (services/questionarioFull.js)
  function codiciRegola(r) {
    if (!r) return [];
    if (r.tipo === 'insegne_ripetute') return Array.isArray(r.codici) ? r.codici : [];
    if (r.tipo === 'carte_numero') return [r.numero, r.nomi].filter(Boolean);
    return [r.anno, r.righe].filter(Boolean);
  }
  function testoConRisposte(testo) {
    function val(c) { var v = S.risposte[c]; return v == null ? '' : Array.isArray(v) ? v.join(', ') : typeof v === 'object' ? '' : String(v).trim(); }
    return String(testo || '').replace(/\s*\(\{(QP_\w+)\}\)/g, function (m, c) { return val(c) ? ' (' + val(c) + ')' : ''; }).replace(/\{(QP_\w+)\}/g, function (m, c) { return val(c); });
  }
  function problemiAltre(r) {
    var out = [];
    if (r.tipo === 'insegne_ripetute') {
      var cod = Array.isArray(r.codici) ? r.codici : [], pos = Array.isArray(r.posizioni) ? r.posizioni : [], visti = {};
      cod.forEach(function (c, i) {
        var v = S.risposte[c];
        if (typeof v !== 'string' || !v.trim()) return;
        var k = normNome(v);
        if (visti[k]) {
          var j = visti[k].j;
          out.push({ firma: 'insegne|' + k + '|' + j + '|' + i, codici: [cod[j], c], testo: String(r.messaggio || '').replace('{insegna}', visti[k].nome).replace('{a}', pos[j] || String(j + 1)).replace('{b}', pos[i] || String(i + 1)) });
        } else visti[k] = { j: i, nome: v.trim() };
      });
    } else if (r.tipo === 'carte_numero') {
      var n = String(S.risposte[r.numero] == null ? '' : S.risposte[r.numero]).trim();
      var nomi = Array.isArray(S.risposte[r.nomi]) ? S.risposte[r.nomi].filter(function (x) { return String(x || '').trim(); }) : [];
      if (/^\d+$/.test(n) && nomi.length > Number(n)) out.push({ firma: 'carte|' + n + '|' + nomi.length, codici: [r.numero, r.nomi], testo: String(r.messaggio || '').replace('{n}', n).replace('{m}', String(nomi.length)) });
    }
    return out;
  }
  function problemiCoerenza(n) {
    var qs = domandeSezione(n).map(function (d) { return d.codice; });
    var out = [];
    (S.dati.coerenza || []).forEach(function (r, i) {
      var inSez = codiciRegola(r).filter(function (c) { return qs.indexOf(c) >= 0; });
      if (!inSez.length) return;
      var sotto = inSez[inSez.length - 1];
      if (r.tipo === 'insegne_ripetute' || r.tipo === 'carte_numero') {
        problemiAltre(r).forEach(function (p, k) { out.push({ chiave: 'c' + i + '_' + k, firma: p.firma, codici: p.codici, sotto: qs.indexOf(p.codici[1]) >= 0 ? p.codici[1] : sotto, testo: p.testo }); });
        return;
      }
      var x = problemaAnno(r, i, qs, sotto);
      if (x) out.push(x);
    });
    return out;
  }
  function problemaAnno(r, i, qs, sotto) {
      if (qs.indexOf(r.anno) < 0 && qs.indexOf(r.righe) < 0) return null;
      var eta = etaDaAnno(S.risposte[r.anno]);
      var riga = (Array.isArray(S.risposte[r.righe]) ? S.risposte[r.righe] : [])[r.riga || 0] || {};
      var cod = riga[r.campo || 'eta'], fascia = intervalloFascia(cod);
      if (!eta || !fascia || (eta[1] >= fascia[0] && eta[0] <= fascia[1])) return null;
      var et = fasceDi(r).filter(function (f) { return f.v === String(cod); })[0];
      var testo = String(r.messaggio || 'Controlla le risposte: non sono coerenti.').replace('{anno}', S.risposte[r.anno]).replace('{eta}', eta[0] + ' o ' + eta[1]).replace('{fascia}', et ? et.t : cod);
      return { chiave: 'c' + i, firma: String(S.risposte[r.anno]) + '|' + cod, codici: [r.anno, r.righe], sotto: qs.indexOf(r.righe) >= 0 ? r.righe : sotto, testo: testo };
  }
  // fascia proposta dall'anno di nascita se la riga e' vuota e l'anno non lascia dubbi; true se ha cambiato qualcosa
  function proponiFascia() {
    var cambiato = false;
    (S.dati.coerenza || []).filter(function (r) { return r.proponi && (r.tipo === 'anno_fascia' || !r.tipo); }).forEach(function (r) {
      var eta = etaDaAnno(S.risposte[r.anno]), fasce = fasceDi(r);
      if (!eta || !fasce.length) return;
      function trova(e) { return fasce.filter(function (f) { var iv = intervalloFascia(f.v); return iv && e >= iv[0] && e <= iv[1]; })[0]; }
      var a = trova(eta[0]), b = trova(eta[1]);
      if (!a || !b || a.v !== b.v) return;
      var righe = Array.isArray(S.risposte[r.righe]) ? S.risposte[r.righe].slice() : [], i = r.riga || 0, k = r.campo || 'eta';
      if (righe[i] && righe[i][k]) return;
      while (righe.length <= i) righe.push({});
      righe[i] = Object.assign({}, righe[i]); righe[i][k] = a.v;
      S.risposte[r.righe] = righe; cambiato = true;
    });
    return cambiato;
  }
  function campoComune(d, sigla, opz) {
    var leggi = opz && opz.get ? opz.get : function () { return S.risposte[d.codice]; };   // P51
    var scrivi = opz && opz.set ? opz.set : function (x) { S.risposte[d.codice] = x; };
    if (!sigla) return el('input', { type: 'text', disabled: 'disabled', placeholder: 'Scegli prima la provincia' });
    var box = el('div');
    var inp = el('input', { type: 'text', autocomplete: 'off', placeholder: 'Scrivi le prime lettere e tocca il comune', value: leggi() || '' });
    var lista = el('div', { classe: 'proposte' }); lista.style.display = 'none';
    var nota = el('div', { classe: 'nota-comune' }); nota.style.display = 'none';
    function elenco() { return S.comuni[sigla] || []; }
    function proponi() {
      var q = normNome(inp.value), l = elenco();
      var esatto = l.some(function (x) { return normNome(x) === q; });
      var prop = q ? l.filter(function (x) { return normNome(x).indexOf(q) === 0; }).concat(l.filter(function (x) { return normNome(x).indexOf(q) > 0; })).slice(0, 8) : l.slice(0, 8);
      lista.innerHTML = '';
      if (esatto || !prop.length || document.activeElement !== inp) { lista.style.display = 'none'; return; }
      prop.forEach(function (nome) {
        var b = el('button', { type: 'button', testo: nome });
        b.addEventListener('mousedown', function (e) { e.preventDefault(); });
        b.addEventListener('click', function () { inp.value = nome; scrivi(nome); lista.style.display = 'none'; nota.style.display = 'none'; });
        lista.appendChild(b);
      });
      lista.style.display = 'block';
    }
    function controlla() {
      var q = normNome(inp.value), l = elenco();
      var fuori = l.length && q && !l.some(function (x) { return normNome(x) === q; });
      nota.textContent = fuori ? 'Non trovo "' + inp.value + '" fra i comuni della provincia (' + sigla + '): controlla come l\'hai scritto o sceglilo dalla lista.' : '';
      nota.style.display = fuori ? 'block' : 'none';
    }
    inp.addEventListener('input', function () { scrivi(inp.value); proponi(); });
    inp.addEventListener('focus', proponi);
    inp.addEventListener('blur', function () { setTimeout(function () { lista.style.display = 'none'; controlla(); }, 200); });
    if (!S.comuni[sigla]) {
      fetch(API + encodeURIComponent(token) + '/comuni/' + encodeURIComponent(sigla)).then(function (r) { return r.json(); })
        .then(function (x) { S.comuni[sigla] = x && x.success ? x.data : []; controlla(); }).catch(function () { S.comuni[sigla] = []; });
    } else setTimeout(controlla, 0);
    box.appendChild(inp); box.appendChild(lista); box.appendChild(nota);
    return box;
  }
  // Ez 12.11.26 P52 - regole delle domande "in quale comune" fuori dalla residenza
  function regoleComuni() {
    var L = S.dati.luoghi || {};
    return (L.altriComuni || []).map(function (a) { return typeof a === 'string' ? { codice: a } : a; });
  }
  function siglaRegola(a) {
    var L = S.dati.luoghi || {};
    var resid = String(S.risposte[L.provincia] || '').toUpperCase();
    if (!a.provincia || (a.stessa && String(S.risposte[a.stessa.domanda]) === String(a.stessa.valore))) return resid;
    return String(S.risposte[a.provincia] || '').toUpperCase();
  }
  // cambiando la provincia o "nella tua provincia?" il comune scelto prima non vale piu'
  function sistemaDipendenze() {
    if (!S.dati || !S.dati.luoghi) return;

    // Ez 11.11.26 P47c - coerenza: alla prima pressione un avviso giallo, alla seconda (stessi valori) si prosegue
    var pr = problemiCoerenza(n).filter(function (p) { return S.confermati[p.chiave] !== p.firma; });
    if (pr.length) { pr.forEach(function (p) { S.confermati[p.chiave] = p.firma; }); disegna(null, pr); return; }
    var b = document.getElementById('avanti'); b.disabled = true;
    if (n < S.dati.sezioni) {
      salva(n).then(function (d) {
        if (!d.success) { b.disabled = false; var a = document.getElementById('avviso'); a.style.display = 'block'; a.textContent = d.error || 'Salvataggio non riuscito: controlla la connessione e riprova.'; return; }
        S.sezione = n + 1; disegna(); scrollTo(0, 0);
      });
      return;
    }
    fetch(API + encodeURIComponent(token) + '/invia', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ risposte: S.risposte }) })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.success) { messaggio('🎉', 'Grazie, profilo inviato!', 'Abbiamo ricevuto il profilo della tua famiglia. Lo valutiamo e ti scriviamo entro 3 giorni lavorativi: se entri nel panel riceverai il codice famiglia e il PIN per accedere all\'app.'); scrollTo(0, 0); return; }
        if (d.codice === 'mancanti' && d.mancanti && d.mancanti.length) { S.sezione = d.mancanti[0].sezione; disegna(d.mancanti.filter(function (m) { return m.sezione === S.sezione; }).map(function (m) { return m.codice; })); return; }
        b.disabled = false; var a = document.getElementById('avviso'); a.style.display = 'block'; a.textContent = d.error || 'Invio non riuscito, riprova.';
      })
      .catch(function () { b.disabled = false; var a = document.getElementById('avviso'); a.style.display = 'block'; a.textContent = 'Connessione non riuscita: le risposte sono salvate, riprova fra poco.'; });
  }

  if (!token) { messaggio('🔗', 'Link incompleto', 'Apri il link esattamente come ti è arrivato nell\'email. Per aiuto scrivi a panel@miaspesa.com.', true); return; }
  fetch(API + encodeURIComponent(token))
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d.success) { messaggio('⌛', 'Link non attivo', d.error || 'Questo link non è più attivo.', true); return; }
      if (d.data.completata) { messaggio('✅', 'Profilo già inviato', 'Grazie' + (d.data.nome ? ', ' + d.data.nome : '') + '! Abbiamo già ricevuto il profilo della tua famiglia: ti scriviamo noi.'); return; }
      S.dati = d.data; S.risposte = d.data.risposte || {};
      if (d.data.versione) document.getElementById('versioneQ').textContent = d.data.versione; // Ez 14.11.26 P60
      if (d.data.nome) document.getElementById('titolo').textContent = 'Ciao ' + d.data.nome + ', ecco il tuo profilo';
      S.sezione = Math.min(Math.max(1, (d.data.ultimaSezione || 0) + 1), d.data.sezioni);
      disegna();
    })
    .catch(function () { messaggio('📶', 'Connessione non riuscita', 'Non riusciamo a caricare il questionario. Controlla la connessione e ricarica la pagina.', true); });
})();
</script>
